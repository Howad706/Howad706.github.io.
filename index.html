<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A simple, responsive landing page">
  <title>My Website</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      color: #1f2937;
      background: #f8fafc;
      line-height: 1.6;
    }

    header, main, footer {
      width: min(100% - 2rem, 960px);
      margin-inline: auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-block: 1rem;
    }

    .logo {
      color: #2563eb;
      font-size: 1.25rem;
      font-weight: 700;
      text-decoration: none;
    }

    nav a {
      margin-left: 1rem;
      color: inherit;
      text-decoration: none;
    }

    .hero {
      padding-block: clamp(4rem, 12vw, 8rem);
      text-align: center;
    }

    .hero h1 {
      margin-bottom: 0.75rem;
      font-size: clamp(2.5rem, 7vw, 4.5rem);
      line-height: 1.1;
    }

    .hero p {
      max-width: 600px;
      margin: 0 auto 1.5rem;
      color: #64748b;
      font-size: 1.125rem;
    }

    .button {
      display: inline-block;
      padding: 0.75rem 1.25rem;
      border-radius: 0.5rem;
      background: #2563eb;
      color: white;
      text-decoration: none;
      font-weight: 600;
    }

    .about {
      padding: 2rem;
      border: 1px solid #e2e8f0;
      border-radius: 1rem;
      background: white;
    }

    footer {
      padding-block: 2rem;
      color: #64748b;
      text-align: center;
    }

    @media (max-width: 520px) {
      header { align-items: flex-start; }
      nav a { margin-left: 0.75rem; font-size: 0.9rem; }
    }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="#">My Website</a>
    <nav aria-label="Main navigation">
      <a href="#about">About</a>
      <a href="mailto:hello@example.com">Contact</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>Welcome to my website</h1>
      <p>A short introduction to what you do, make, or share goes here.</p>
      <a class="button" href="#about">Learn more</a>
    </section>

    <section class="about" id="about">
      <h2>About</h2>
      <p>
        Add a few sentences about yourself, your project, or your business.
        You can customize this page with your own colors, images, and links.
      </p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 My Website</p>
  </footer>
</body>
</html>
